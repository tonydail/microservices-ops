name: "Generate User Story to Project Field"

on:
  issues:
    types: [labeled]

jobs:
  create-user-story:
    # Executes when any tracking issue receives the official 'approved' flag
    if: >-
      contains(github.event.issue.labels.*.name, 'approved') && 
      contains(github.event.issue.labels.*.name, 'enhancement-request') &&
      contains(github.event.issue.labels.*.name, 'new-microservice')
    runs-on: ubuntu-latest
    steps:
      - name: Create Tracking User Story Issue for adding new microservice
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const parentIssue = context.payload.issue;
            const parentTitle = parentIssue.title.replace(/^\[.*?\]:\s*/, '');
            const parentBody = parentIssue.body || '';

            // Regex looks for the 'Business Value & Objective' markdown header 
            // and captures everything until the next markdown header '###' or end of string
            const objectiveMatch = parentBody.match(/###\s+Business Value & Objective\s*\r?\n([\s\S]*?)(?=\r?\n###|\s*$)/i);
            // FIXED: Safe array boundary protection logic to avoid 'Cannot read properties of null' errors
            const objectiveText = objectiveMatch && objectiveMatch[1] ? objectiveMatch[1].trim() : '_No objective provided._';
            
            // To include backticks safely inside a JavaScript template literal, they must be escaped using a backslash (\`)
            const storyBody = `## 📖 ${parentTitle}
            
            **Parent Tracking Issue**: #${parentIssue.number}

            ### 🎯 Objective & Business Value
            ${objectiveText}
            
            ### 📋 Acceptance Criteria
            Each acceptance criterion should be clear, testable, and measurable. Ensure that the criteria are specific and actionable.
            Developers and testers should be able to verify that the feature meets these criteria before considering it complete.

            - Create new microservice repository with initial setup and configuration.
              - Scaffold the microservice with necessary dependencies and configurations.
              - Docker compose and dev container setup for local development and testing (e.g., docker-compose.yml, devcontainer.json).
              - Local development orchestration configuration files (e.g., local-orchestration.yml) for local development and testing.
              - Project structure and initial codebase setup (e.g., src/, tests/, etc.).
              
                \`\`\`
                .
                ├── .devcontainer/
                │   ├── devcontainer.json
                │   ├── docker-compose.yml
                │   └── docker-compose.devcontainer.yml
                ├── prisma/
                ├── src/
                │   ├── config/
                │   ├── controllers/
                │   ├── events/
                │   ├── grpc/
                │   ├── middleware/
                │   ├── repositories/
                │   ├── routes/
                │   ├── services/
                │   ├── types/
                │   └── index.ts                 # Entry point
                ├── tests/
                │   ├── integration/
                │   └── unit/
                ├── .eslintrc.json
                ├── .gitignore
                ├── .prettierrc
                ├── package.json
                ├── register-outbox-connector.sh
                ├── start.sh
                ├── stop.sh
                ├── tsconfig.json
                └── vitest.config.ts
                \`\`\`
              

            - Ensure that the microservice adheres to the organization's coding standards and best practices (e.g., CODEOWNERS, CONTRIBUTING.md, etc.).

            ### 🏗️ Architectural Execution Notes
            - Impact analysis and design considerations should be documented here.
            - Systemic design boundaries and dependencies should be clearly outlined.
                
            ### 🛠️ Execution Checklist
            - [ ] Complete impact analysis and design considerations
            - [ ] Complete design and architecture documentation
            - [ ] Update 'Impacted Microservices' with new microservice name
            - [ ] Label as 'ready-for-development'
            - [ ] Implement required application changes
            - [ ] Ensure unit tests are written and passing
            - [ ] Ensure integration tests are written and passing

            ### 🏁 Definition of Done
            - [ ] Microservice container can be started stand-alone and also as a devcontainer
            - [ ] Code reviews finalized and verification pipelines green`;
            
            const newIssue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${parentTitle}`,
              body: storyBody,
              labels: ['feature', 'user-story', 'needs-details']
            });
            
            core.setOutput('issue_node_id', newIssue.data.node_id);

      - name: Link User Story to Project Board
        uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_NODE_ID }}
        with:
          github-token: ${{ env.PROJECT_TOKEN }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const contentId = "${{ steps.create_issue.outputs.issue_node_id }}";
            
            const query = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item {
                    id
                  }
                }
              }
            `;
            
            await github.graphql(query, { projectId, contentId });
