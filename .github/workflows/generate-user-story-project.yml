name: "Generate User Story to Project Field"

on:
  issues:
    types: [labeled]

jobs:
  create-user-story:
    # Executes when any tracking issue receives the official 'approved' flag
    if: >-
      contains(github.event.issue.labels.*.name, 'approved') && 
      contains(github.event.issue.labels.*.name, 'enhancement')
    runs-on: ubuntu-latest
    steps:
      - name: Create Tracking User Story Issue
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const parentIssue = context.payload.issue;
            const parentTitle = parentIssue.title.replace(/^\[.*?\]:\s*/, '');
            const parentBody = parentIssue.body || '';

            // Regex looks for the 'Business Value & Objective' markdown header 
            // and captures everything until the next markdown header '###' or end of string
            const objectiveMatch = parentBody.match(/###\s+Business Value & Objective\s*\r?\n([\s\S]*?)(?=\r?\n###|\s*$)/i);
            const objectiveText = objectiveMatch ? objectiveMatch[1].trim() : '_No objective provided._';
            
            const storyBody = `## 📖 ${parentTitle}
            
            **Parent Tracking Issue**: #${parentIssue.number}

            ### 🎯 Objective & Business Value
            ${objectiveText}
            
            ### 📋 Acceptance Criteria
            Each acceptance criterion should be clear, testable, and measurable. Ensure that the criteria are specific and actionable.
            Developers and testers should be able to verify that the feature meets these criteria before considering it complete.
            
            -  Acceptance criteria 1
            -  Acceptance criteria 2
            -  Acceptance criteria 3

            ### 🏗️ Architectural Execution Notes
            - Impact analysis and design considerations should be documented here.
            - Systemic design boundaries and dependencies should be clearly outlined.
              
            ### 🛠️ Execution Checklist
            - [ ] Complete impact analysis and design considerations
            - [ ] Complete design and architecture documentation
            - [ ] Update 'Impacted Microservices'
            - [ ] Label as 'ready-for-development'
            - [ ] Implement required application changes
            - [ ] Ensure unit tests are written and passing
            - [ ] Ensure integration tests are written and passing
            
            ### 🏁 Definition of Done
            - [ ] Code integrated across all target components
            - [ ] Code reviews finalized and verification pipelines green`;
            
            const newIssue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${parentTitle}`,
              body: storyBody,
              labels: ['enhancement', 'user-story', 'needs-details']
            });
            
            core.setOutput('issue_node_id', newIssue.data.node_id);

      - name: Link User Story to Project Board
        uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_NODE_ID }}
        with:
          github-token: ${{ env.PROJECT_TOKEN }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const contentId = "${{ steps.create_issue.outputs.issue_node_id }}";
            
            const query = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item {
                    id
                  }
                }
              }
            `;
            
            await github.graphql(query, { projectId, contentId });
